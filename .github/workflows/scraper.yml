name: Chart Scraper

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        uses: py-actions/pip-install@v5
        with:
          packages: requests beautifulsoup4

      - name: Run collector
        run: python collector.py

      - name: Save history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add melon_rank_history.json
          git commit -m "Update chart history" || echo "No changes"
          git push
